name: tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  regress:
    name: regress
    runs-on: ubuntu-latest

    strategy:
      matrix:
        version: ['13', '14', '15', '16', '17', '18', '19beta3']

    steps:

      - name: Check out code
        uses: actions/checkout@v5

      - name: Run tests
        run: |
            docker build . -f test/Dockerfile --tag spqrhash-test:1.0 --build-arg PG_VERSION=${{ matrix.version }} && docker run spqrhash-test:1.0

